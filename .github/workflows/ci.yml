name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '__tests__/**'
      - 'dist/**'
      - 'src/**'
      - 'VCLUSTER_VERSION'
      - 'action.yml'
      - 'eslint.config.mjs'
      - 'jest*.js'
      - 'package*.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '__tests__/**'
      - 'dist/**'
      - 'src/**'
      - 'VCLUSTER_VERSION'
      - 'action.yml'
      - 'eslint.config.mjs'
      - 'jest*.js'
      - 'package*.json'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand

  check-dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check dist/ is up to date
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit."
            git diff --stat dist/
            exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, check-dist]
    strategy:
      fail-fast: false
      matrix:
        vcluster-version: [latest, v0.32.2-rc.1, pinned]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned version
        if: matrix.vcluster-version == 'pinned'
        id: pinned
        run: echo "version=$(cat VCLUSTER_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          version: ${{ matrix.vcluster-version == 'pinned' && steps.pinned.outputs.version || matrix.vcluster-version }}
          name: ci-test-${{ strategy.job-index }}
      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl cluster-info
      - name: Verify vcluster
        run: |
          vcluster list
          vcluster --version
